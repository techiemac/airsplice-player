[package]
name = "airsplice-player"
version = "0.3.0"
edition = "2024"
description = "A cross-platform media player with a Zed-style UI, built on GPUI and pure-Rust decoders"
license = "Apache-2.0"

[dependencies]
# UI: Zed's own GPU-accelerated UI framework.
gpui = "0.2.2"
# Demuxing (MP4, MKV/WebM, OGG, WAV, AIFF, CAF) and audio decoding (MP3, AAC,
# FLAC, Vorbis, ALAC, PCM, ADPCM), all pure Rust.
symphonia = { version = "0.6.1", features = ["all", "exp-video-codecs"] }
# Audio output (CoreAudio, WASAPI, ALSA/PulseAudio/PipeWire).
cpal = "0.18.2"
# Sample-rate conversion.
rubato = "5.1.0"
# AV1 video: Rust port of dav1d. Built without its assembly: the published
# 1.1.0 crate omits src/arm/asm-offsets.h, and pure Rust needs no nasm on x86.
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
# H.264 video: Cisco's BSD-licensed decoder, built from bundled source.
# There is no production-quality pure-Rust H.264 decoder.
openh264 = "0.9.10"
openh264-sys2 = "0.9.10"
# Cover art decoding and the frame type GPUI renders.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Reads GIF frame delays without decoding pixels, to time animations.
gif = "0.14"
rayon = "1.10"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
ropus = "0.12.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
cros-codecs = { version = "0.0.6", default-features = false }
notify = "8"
# Real-time upscaling on the GPU (FSR 1 compute shaders) through Vulkan,
# Direct3D 12 or Metal. Pinned a release behind the newest. On Windows,
# Cargo.lock must give gpu-allocator (which accepts windows 0.53 to 0.62)
# the same windows version as wgpu-hal (0.62), not GPUI's 0.61, or the
# Direct3D 12 backend does not compile; CI's Windows job catches it.
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
pollster = "1"

[profile.dev]
# This crate too: per-pixel work and the image crate's generic code (built
# here) run 8 to 10x faster than unoptimised, so debug builds stay usable.
opt-level = 1

[profile.dev.package."*"]
# Decoders are unusably slow without optimisation, even in debug builds.
opt-level = 3

[profile.release]
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
# Stateless V4L2 hardware decoding (Raspberry Pi HEVC): kernel struct
# definitions generated from the system headers, and ioctl declarations.
v4l2r = "0.0.8"
nix = { version = "0.28", features = ["ioctl"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The window handle souvlaki needs for Windows media controls.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Compile GPUI's Metal shaders at launch so building needs no separate Metal
# Toolchain download (Xcode 26 no longer bundles it).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# Hardware video decoding through the OS (VideoToolbox).
objc2-video-toolbox = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-foundation = "0.3.2"
# Real-time upscaling with MetalFX, the system's GPU upscaler.
objc2 = "0.6"
objc2-metal = "0.3.2"
objc2-metal-fx = "0.3.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
usvg = "0.45"

[patch.crates-io]
# Lifts a 1 KiB limit on avcC/hvcC records; see vendor/symphonia-format-isomp4/PATCHED.md.
symphonia-format-isomp4 = { path = "vendor/symphonia-format-isomp4" }
# Decodes 5.1 and 7.1 AAC-LC; see vendor/symphonia-codec-aac/PATCHED.md.
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }
# Builds on Linux with current libc; see vendor/xattr/PATCHED.md.
xattr = { path = "vendor/xattr" }
# Parses 4K wavefront HEVC streams; see vendor/cros-codecs/PATCHED.md.
cros-codecs = { path = "vendor/cros-codecs" }
